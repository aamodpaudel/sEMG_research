<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DOM-0 benchmark</title></head>
<body style="margin: 0">
<!-- Manual run in a normal browser (start Chrome with --allow-file-access-from-files, or serve this folder).
     The scored run is `python -m semg.dom_eval`, which loads fixture.html directly at 1280x800. -->
<pre id="out">running</pre>
<iframe id="f" src="fixture.html" style="width: 1280px; height: 800px; border: 0"></iframe>
<script src="../dom-model.js"></script>
<script src="../commands.js"></script>
<script src="score.js"></script>
<script>
document.getElementById("f").addEventListener("load", function () {
  var res = AfonoEval.fixture(this.contentDocument);
  delete res.targets;
  document.getElementById("out").textContent = "RESULT " + JSON.stringify(res);
});
</script>
</body>
</html>
